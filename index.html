<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新力機械有限公司 - 員工假期管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f4; color: #1c2e24; font-family: system-ui, -apple-system, sans-serif; }
    .bg-sidebar { background-color: #12291e; }
    .accent-green { background-color: #c0f068; color: #12291e; }
    .accent-green:hover { background-color: #aadb4d; }
  </style>
</head>
<body class="flex h-screen">

  <!-- 左側導覽列 -->
  <aside class="w-64 bg-sidebar text-white flex flex-col justify-between p-4 shrink-0">
    <div>
      <div class="flex items-center gap-3 mb-8 px-2">
        <div class="w-8 h-8 rounded-full accent-green flex items-center justify-center font-bold">L</div>
        <span class="text-xl font-bold tracking-wide">員工假期管理系統</span>
      </div>
      <nav class="space-y-2">
        <button onclick="switchTab('calendar')" id="nav-calendar" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 font-medium transition">
          <i class="fa-regular font-bold fa-calendar-days"></i> 團隊月曆
        </button>
        <button onclick="switchTab('employees')" id="nav-employees" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 font-medium text-gray-300 transition">
          <i class="fa-solid fa-users"></i> 員工管理
        </button>
      </nav>
    </div>
    <div class="bg-white/5 p-3 rounded-xl text-xs text-gray-400">
      <i class="fa-solid fa-circle-check text-green-400 mr-1"></i> Vercel 已連線
    </div>
  </aside>

  <!-- 右側主要內容區 -->
  <main class="flex-1 overflow-y-auto p-8">
    <header class="flex justify-between items-center mb-6">
      <div>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">員工假期管理系統</p>
        <h1 class="text-2xl font-bold">新力機械有限公司 ✦</h1>
      </div>
      <button onclick="openLeaveModal()" class="accent-green px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-sm cursor-pointer">
        <i class="fa-solid fa-plus"></i> 新增申請
      </button>
    </header>

    <div class="bg-green-50 border border-green-200 text-green-800 px-4 py-2.5 rounded-xl mb-6 text-sm flex items-center justify-between">
      <span id="sync-status"><i class="fa-solid fa-arrows-rotate animate-spin mr-2"></i> 正在與 Google Sheets 即時同步...</span>
      <button onclick="loadData()" class="underline font-semibold cursor-pointer">立即刷新</button>
    </div>

    <!-- 頁面 1: 團隊月曆 -->
    <section id="page-calendar" class="space-y-4">
      <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold">團隊月曆</h2>
<div class="flex items-center gap-2">
  <button onclick="changeMonth(-1)" class="p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><i class="fa-solid fa-chevron-left"></i></button>
  
  <!-- 年份選擇 -->
  <select id="select-year" onchange="onDatePickerChange()" class="p-2 border rounded-lg font-bold text-sm bg-white cursor-pointer"></select>
  
  <!-- 月份選擇 -->
  <select id="select-month" onchange="onDatePickerChange()" class="p-2 border rounded-lg font-bold text-sm bg-white cursor-pointer">
    <option value="1">1 月</option>
    <option value="2">2 月</option>
    <option value="3">3 月</option>
    <option value="4">4 月</option>
    <option value="5">5 月</option>
    <option value="6">6 月</option>
    <option value="7">7 月</option>
    <option value="8">8 月</option>
    <option value="9">9 月</option>
    <option value="10">10 月</option>
    <option value="11">11 月</option>
    <option value="12">12 月</option>
  </select>

  <button onclick="changeMonth(1)" class="p-2 border rounded-lg hover:bg-gray-50 cursor-pointer"><i class="fa-solid fa-chevron-right"></i></button>
</div>
        </div>
        <div class="grid grid-cols-7 gap-2 text-center text-sm font-semibold text-gray-400 mb-2">
          <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
      </div>
    </section>

    <!-- 頁面 2: 員工管理 -->
    <section id="page-employees" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold">員工管理</h2>
          <p class="text-sm text-gray-500">檢視員工年假額度、制度及狀態。</p>
        </div>
        <button onclick="openEmpModal()" class="bg-sidebar text-white px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer">
          + 新增員工
        </button>
      </div>
      <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-500">
              <th class="p-4">員工</th>
              <th class="p-4">部門 / 職位</th>
              <th class="p-4">工作制度</th>
              <th class="p-4">入職日期</th>
              <th class="p-4">年假 (剩餘/總額)</th>
              <th class="p-4">已取無薪假</th>
            </tr>
          </thead>
          <tbody id="emp-table-body" class="divide-y text-sm"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 彈窗 1: 提交請假申請 -->
  <div id="leave-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-lg font-bold">提交請假申請</h3>
      <form id="leave-form" onsubmit="handleLeaveSubmit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600">選擇員工</label>
          <select id="leave-emp" required class="w-full p-2 border rounded-lg text-sm mt-1"></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">假期類型</label>
          <select id="leave-type" class="w-full p-2 border rounded-lg text-sm mt-1">
            <option value="年假">年假</option>
            <option value="病假">病假</option>
            <option value="無薪假">無薪假</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600">開始日期</label>
            <input type="date" id="leave-start" required class="w-full p-2 border rounded-lg text-sm mt-1">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600">結束日期</label>
            <input type="date" id="leave-end" required class="w-full p-2 border rounded-lg text-sm mt-1">
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">時段</label>
          <select id="leave-slot" class="w-full p-2 border rounded-lg text-sm mt-1">
            <option value="全日">全日</option>
            <option value="上午">上午 (半日)</option>
            <option value="下午">下午 (半日)</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">備註</label>
          <textarea id="leave-remark" class="w-full p-2 border rounded-lg text-sm mt-1" rows="2"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeLeaveModal()" class="px-4 py-2 border rounded-lg text-sm cursor-pointer">取消</button>
          <button type="submit" class="accent-green px-4 py-2 rounded-lg text-sm font-bold cursor-pointer">確認提交</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 2: 新增員工 -->
  <div id="emp-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-lg font-bold">新增員工資料</h3>
      <form id="emp-form" onsubmit="handleEmpSubmit(event)" class="space-y-3">
        <div>
          <label class="text-xs font-semibold text-gray-600">員工編號</label>
          <input type="text" id="emp-id" required placeholder="例如：EMP003" class="w-full p-2 border rounded-lg text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">姓名</label>
          <input type="text" id="emp-name" required placeholder="例如：陳大文" class="w-full p-2 border rounded-lg text-sm mt-1">
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">部門 / 職位</label>
          <input type="text" id="emp-dept" required placeholder="例如：運輸部 / 司機" class="w-full p-2 border rounded-lg text-sm mt-1">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600">入職日期</label>
            <input type="date" id="emp-join" required class="w-full p-2 border rounded-lg text-sm mt-1">
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600">工作制度</label>
            <select id="emp-system" class="w-full p-2 border rounded-lg text-sm mt-1">
              <option value="六天工作">六天工作</option>
              <option value="長短周-A組">長短周 - A組</option>
              <option value="長短周-B組">長短周 - B組</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeEmpModal()" class="px-4 py-2 border rounded-lg text-sm cursor-pointer">取消</button>
          <button type="submit" class="accent-green px-4 py-2 rounded-lg text-sm font-bold cursor-pointer">儲存員工</button>
        </div>
      </form>
    </div>
  </div>

  <script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbymeoa0EboccXjiL_xFSFC1AZ0_FS7U1ogPHsy3ZYPngtCK7osw1EWpHiiPv8wuTRRx/exec";

  let currentDate = new Date();
  let globalEmployees = [];
  let globalCalendarData = {};

  // 1. JSONP 請求機制
  function fetchJSONP(baseUrl, paramsObj = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve(data);
      };

      const urlObj = new URL(baseUrl);
      Object.keys(paramsObj).forEach(key => {
        urlObj.searchParams.append(key, paramsObj[key]);
      });
      urlObj.searchParams.append('callback', callbackName);

      const script = document.createElement('script');
      script.src = urlObj.toString();
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        reject(new Error('JSONP 攔截'));
      };
      
      document.body.appendChild(script);
    });
  }

  // 2. 雙重保障請求：JSONP 失敗時自動降級使用 Fetch
  async function smartFetch(paramsObj = {}) {
    try {
      // 優先嘗試 JSONP
      return await fetchJSONP(GAS_API_URL, paramsObj);
    } catch (err) {
      console.warn("JSONP 遭瀏覽器套件阻擋，自動切換至 Fetch 備用機制...", err);
      
      // 備用機制：使用 Fetch 讀取
      const urlObj = new URL(GAS_API_URL);
      Object.keys(paramsObj).forEach(key => urlObj.searchParams.append(key, paramsObj[key]));
      
      const res = await fetch(urlObj.toString(), { redirect: 'follow' });
      return await res.json();
    }
  }

  function switchTab(tab) {
    document.getElementById('page-calendar').classList.toggle('hidden', tab !== 'calendar');
    document.getElementById('page-employees').classList.toggle('hidden', tab !== 'employees');
    
    const navCal = document.getElementById('nav-calendar');
    const navEmp = document.getElementById('nav-employees');
    
    if(tab === 'calendar') {
      navCal.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 font-medium transition";
      navEmp.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 font-medium text-gray-300 transition";
    } else {
      navEmp.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 font-medium transition";
      navCal.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 font-medium text-gray-300 transition";
    }
  }

  function openLeaveModal() {
    document.getElementById('leave-modal').classList.remove('hidden');
    document.getElementById('leave-modal').classList.add('flex');
  }

  function closeLeaveModal() {
    document.getElementById('leave-modal').classList.add('hidden');
    document.getElementById('leave-modal').classList.remove('flex');
  }

  function openEmpModal() {
    document.getElementById('emp-modal').classList.remove('hidden');
    document.getElementById('emp-modal').classList.add('flex');
  }

  function closeEmpModal() {
    document.getElementById('emp-modal').classList.add('hidden');
    document.getElementById('emp-modal').classList.remove('flex');
  }

  function changeMonth(offset) {
    currentDate.setMonth(currentDate.getMonth() + offset);
    loadData();
  }

  async function loadData() {
    const statusEl = document.getElementById('sync-status');
    statusEl.innerHTML = `<i class="fa-solid fa-arrows-rotate animate-spin mr-2"></i> 正在同步 Google Sheets...`;
    
    try {
      globalEmployees = await smartFetch({ action: 'getEmployees' });
      renderEmployees();
      populateEmpDropdown();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      globalCalendarData = await smartFetch({ action: 'getCalendar', year: year, month: month });
      renderCalendar();

      statusEl.innerHTML = `<i class="fa-solid fa-circle-check text-green-600 mr-2"></i> 已同步最新資料`;
    } catch (err) {
      console.error("同步最終失敗:", err);
      statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500 mr-2"></i> 同步失敗，請重試`;
    }
  }

  function renderEmployees() {
    const tbody = document.getElementById('emp-table-body');
    if (!globalEmployees || globalEmployees.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">暫無員工資料</td></tr>`;
      return;
    }
    tbody.innerHTML = globalEmployees.map(e => `
      <tr>
        <td class="p-4 font-semibold">${e.name}<br><span class="text-xs text-gray-400">${e.empId}</span></td>
        <td class="p-4">${e.deptRole}</td>
        <td class="p-4"><span class="px-2 py-1 bg-gray-100 rounded text-xs">${e.workSystem}</span></td>
        <td class="p-4">${e.joinDate}</td>
        <td class="p-4 font-bold text-green-700">${e.remainingAnnualLeave} / ${e.annualLeaveQuota} 天</td>
        <td class="p-4 font-bold text-amber-600">${e.usedUnpaidLeave} 天</td>
      </tr>
    `).join('');
  }

  function populateEmpDropdown() {
    const sel = document.getElementById('leave-emp');
    if (globalEmployees && globalEmployees.length > 0) {
      sel.innerHTML = globalEmployees.map(e => `<option value="${e.empId}">${e.name} (${e.empId})</option>`).join('');
    }
  }

// 動態初始化年份下拉選單 (例如前後 3 年：2023 - 2029)
  function initYearDropdown() {
    const yearSelect = document.getElementById('select-year');
    if (!yearSelect || yearSelect.options.length > 0) return;
    
    const currentY = new Date().getFullYear();
    for (let y = currentY - 3; y <= currentY + 3; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.innerText = `${y} 年`;
      yearSelect.appendChild(opt);
    }
  }

  // 下拉選單切換時觸發
  function onDatePickerChange() {
    const selectedYear = parseInt(document.getElementById('select-year').value);
    const selectedMonth = parseInt(document.getElementById('select-month').value) - 1; // 月份為 0-indexed
    
    currentDate.setFullYear(selectedYear);
    currentDate.setMonth(selectedMonth);
    loadData();
  }

  // 左右箭頭切換按鈕
  function changeMonth(offset) {
    currentDate.setMonth(currentDate.getMonth() + offset);
    loadData();
  }

  // 更新渲染月曆及連動下拉選單
  function renderCalendar() {
    initYearDropdown();

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    // 同步下拉選單的值
    document.getElementById('select-year').value = year;
    document.getElementById('select-month').value = month + 1;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="h-24 bg-gray-50/50 rounded-xl"></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayLeaves = (globalCalendarData.requests || []).filter(r => dateStr >= r.startDate && dateStr <= r.endDate);

      let leaveBadges = dayLeaves.map(l => `
        <div class="text-xs bg-green-100 text-green-800 p-1 rounded mb-1 truncate">
          ${l.name} · ${l.type}
        </div>
      `).join('');

      grid.innerHTML += `
        <div class="h-24 border rounded-xl p-2 bg-white flex flex-col justify-between">
          <div class="font-bold text-sm text-gray-500">${d}</div>
          <div class="overflow-y-auto flex-1 my-1">${leaveBadges}</div>
        </div>
      `;
    }
  }

  async function handleLeaveSubmit(e) {
    e.preventDefault();
    const form = {
      empId: document.getElementById('leave-emp').value,
      leaveType: document.getElementById('leave-type').value,
      startDate: document.getElementById('leave-start').value,
      endDate: document.getElementById('leave-end').value,
      timeSlot: document.getElementById('leave-slot').value,
      remark: document.getElementById('leave-remark').value,
    };

    try {
      const params = new URLSearchParams();
      params.append('action', 'submitLeave');
      params.append('form', JSON.stringify(form));

      await fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });

      alert("申請已提交！");
      closeLeaveModal();
      setTimeout(loadData, 1500);
    } catch (err) {
      alert("提交失敗，請檢查網路");
    }
  }

  async function handleEmpSubmit(e) {
    e.preventDefault();
    const empData = {
      empId: document.getElementById('emp-id').value,
      name: document.getElementById('emp-name').value,
      deptRole: document.getElementById('emp-dept').value,
      joinDate: document.getElementById('emp-join').value,
      workSystem: document.getElementById('emp-system').value,
      status: '在職'
    };

    try {
      const params = new URLSearchParams();
      params.append('action', 'saveEmployee');
      params.append('form', JSON.stringify(empData));

      await fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });

      alert("員工資料儲存成功！");
      closeEmpModal();
      setTimeout(loadData, 1500);
    } catch (err) {
      alert("儲存失敗，請檢查網路");
    }
  }

  window.onload = function() {
    loadData();
  };
</script>
</body>
</html>
